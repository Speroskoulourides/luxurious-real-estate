name: Add EL Approach

on:
  push:
    paths:
      - '.github/workflows/add-el-approach.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approach section
        run: |
          echo '' | base64 -d > /tmp/approach.html
          python3 -c "from pathlib import Path; p=Path('el/index.html'); s=p.read_text(encoding='utf-8'); b=Path('/tmp/approach.html').read_text(encoding='utf-8'); p.write_text(s if 'id=\"approach\"' in s else s.replace('</main>', b+'\n</main>', 1), encoding='utf-8')"
      - name: Verify and commit
        run: |
          grep -F 'id="approach"' el/index.html
          git diff --check
          if git diff --quiet; then exit 0; fi
          test "$(git diff --name-only)" = "el/index.html"
          git config user.name 'SNK EL approach update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Add EL Approach section'
          git push origin HEAD:main
