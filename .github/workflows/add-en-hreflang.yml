name: Add EN hreflang tags

on:
  push:
    paths:
      - '.github/workflows/add-en-hreflang.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add EN hreflang
        run: python .github/scripts/add_en_hreflang.py
      - name: Verify only EN changed
        run: |
          git diff --exit-code -- . ':(exclude)index.html'
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "SNK EN SEO"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add EN hreflang tags"
          git push origin main
