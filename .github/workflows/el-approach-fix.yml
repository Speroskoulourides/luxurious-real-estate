name: EL Approach Fix

on:
  push:
    paths:
      - .github/workflows/el-approach-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approach section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('el/index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="approach"' not in s:
              block = '''<section class="approach section-dark" id="approach">
<p class="eyebrow">Η ΠΡΟΣΕΓΓΙΣΗ ΜΑΣ</p>
<h2>Από το πρώτο ενδιαφέρον<br>στην ιδιωτική αξιολόγηση.</h2>
<div class="process">
<article><span>01</span><h3>Ανακαλύψτε</h3><p>Δείτε το επιλεγμένο επενδυτικό έργο μέσα από την ειδικά διαμορφωμένη παρουσίασή του.</p></article>
<article><span>02</span><h3>Επικοινωνήστε</h3><p>Εκδηλώστε το ενδιαφέρον σας απευθείας στην ομάδα της SNK Real Estate.</p></article>
<article><span>03</span><h3>Αξιολογήστε</h3><p>Λάβετε πρόσθετες πληροφορίες και οργανώστε ιδιωτική επίσκεψη, όπου αυτό είναι κατάλληλο.</p></article>
</div>
<div class="contact-transition"><p class="transition-label">ΕΤΟΙΜΟΙ ΓΙΑ ΙΔΙΩΤΙΚΗ ΑΞΙΟΛΟΓΗΣΗ;</p><p>Υποβάλετε το εμπιστευτικό σας αίτημα για περισσότερες πληροφορίες<br>και οργανώστε <span class="gold-text">το επόμενο βήμα.</span></p></div>
</section>'''
              if '</main>' not in s:
                  raise SystemExit('missing main close')
              s = s.replace('</main>', block + '\n</main>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          grep -F 'id="approach"' el/index.html
          grep -F 'Η ΠΡΟΣΕΓΓΙΣΗ ΜΑΣ' el/index.html
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'SNK EL approach update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Add EL Approach section'
          git push origin HEAD:main
