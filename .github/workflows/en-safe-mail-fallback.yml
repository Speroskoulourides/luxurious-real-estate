name: EN safe mail fallback

on:
  push:
    paths:
      - '.github/workflows/en-safe-mail-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add reliable EN mail fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          marker='id="snk-en-mail-fallback"'
          if marker in text:
              raise SystemExit('Fallback already present')

          script=r'''
<script id="snk-en-mail-fallback">
(()=>{
  const form=document.getElementById('snkInvestorForm');
  if(!form)return;
  form.removeAttribute('action');
  form.removeAttribute('target');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(!form.reportValidity())return;
    const fd=new FormData(form);
    const get=n=>String(fd.get(n)||'').trim();
    const subject='SNK Website Enquiry - '+(get('fullName')||'Investor');
    const body=[
      'New SNK Website Enquiry','',
      'Full Name: '+get('fullName'),
      'Email: '+get('email'),
      'Company / Organisation: '+get('company'),
      'Position / Title: '+get('position'),
      'Country: '+get('country'),
      'Mobile / Telephone: '+get('mobile'),
      'Investor Type: '+get('investorType'),
      'Investment Range: '+get('investmentRange'),
      'Area of Interest: '+get('interest'),
      'Message: '+get('message')
    ].join('\n');
    window.location.href='mailto:investments@snkrealestate.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  });
})();
</script>
'''
          text=text.replace('</body>',script+'</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit fallback
        shell: bash
        run: |
          git config user.name "SNK Form Restore"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add reliable EN email fallback"
          git push origin main
