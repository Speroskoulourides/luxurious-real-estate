name: Fix EL Company geometry

on:
  push:
    paths:
      - '.github/workflows/fix-el-company-geometry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply EL Company geometry
        run: python3 .github/scripts/fix_el_company_geometry.py
      - name: Verify and commit
        run: |
          grep -F '#company{min-height:calc(100vh - 76px)!important;scroll-margin-top:0!important}' el/index.html
          test "$(git diff --name-only)" = "el/index.html"
          git diff --check
          git config user.name 'SNK EL Company geometry'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Fix EL Company geometry'
          git push origin HEAD:main
