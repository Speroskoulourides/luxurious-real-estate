name: Fix EL Company geometry

on:
  push:
    paths:
      - '.github/workflows/fix-el-company-geometry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align EL Company with fixed header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('el/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SNK UNIVERSAL HEADER STYLES END -->\n'
          block = '''<!-- SNK UNIVERSAL HEADER STYLES END -->
<style id="el-corporate-geometry-test">
html{scroll-padding-top:76px!important}
body.snk-universal-header-enabled{padding-top:0!important}
.hero{height:100vh!important}
#company{min-height:calc(100vh - 76px)!important;scroll-margin-top:0!important}
@media(max-width:560px){html{scroll-padding-top:68px!important}body.snk-universal-header-enabled{padding-top:0!important}.hero{height:100vh!important}}
</style>
'''
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one universal header end marker, found {s.count(marker)}')
          if 'id="el-corporate-geometry-test"' in s:
              raise SystemExit('EL geometry block already exists')
          s = s.replace(marker, block, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F '#company{min-height:calc(100vh - 76px)!important;scroll-margin-top:0!important}' el/index.html
          test "$(git diff --name-only)" = "el/index.html"
          git diff --check
          git config user.name 'SNK EL Company geometry'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Fix EL Company geometry'
          git push origin HEAD:main
