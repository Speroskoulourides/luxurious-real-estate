name: Fix EL Opportunities anchor offset

on:
  push:
    paths:
      - '.github/workflows/fix-el-opportunities-anchor.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply EL Opportunities anchor fix
        run: python3 .github/scripts/fix_el_opportunities_anchor.py
      - name: Verify and commit
        run: |
          grep -F '#opportunities{scroll-margin-top:0!important}' el/index.html
          test "$(git diff --name-only)" = "el/index.html"
          git diff --check
          git config user.name 'SNK EL Opportunities anchor'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Fix EL Opportunities anchor offset'
          git push origin HEAD:main
