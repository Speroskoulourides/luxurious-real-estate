name: Add Chinese Golden Visa to EN Signature menu

on:
  push:
    paths:
      - '.github/workflows/fix-en-signature-golden-visa-menu.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Chinese Golden Visa to EN Signature header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vouliagmeni-en/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<nav id="snk-universal-nav" class="snk-universal-nav" aria-label="Main navigation"><a href="/#company">COMPANY</a><a href="/#opportunities">OPPORTUNITIES</a><a href="/vouliagmeni-en/">SIGNATURE</a><a href="/#approach">APPROACH</a><a href="/#contact">CONTACT</a></nav>'
          new = '<nav id="snk-universal-nav" class="snk-universal-nav" aria-label="Main navigation"><a href="/#company">COMPANY</a><a href="/#opportunities">OPPORTUNITIES</a><a href="/vouliagmeni-en/">SIGNATURE</a><a href="/#approach">APPROACH</a><a href="/#contact">CONTACT</a><a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a></nav>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one EN Signature universal nav, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F '<a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>' vouliagmeni-en/index.html
          test "$(git diff --name-only)" = "vouliagmeni-en/index.html"
          git diff --check
          git config user.name 'SNK EN Signature menu'
          git config user.email 'actions@users.noreply.github.com'
          git add vouliagmeni-en/index.html
          git commit -m 'Add Chinese Golden Visa to EN Signature menu'
          git push origin HEAD:main
