name: Fix ES Approach anchor offset

on:
  push:
    paths:
      - '.github/workflows/fix-es-approach-anchor.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply ES Approach anchor fix
        run: python3 .github/scripts/fix_es_approach_anchor.py
      - name: Verify and commit
        run: |
          grep -F '#approach{scroll-margin-top:0!important}' es/index.html
          test "$(git diff --name-only)" = "es/index.html"
          git diff --check
          git config user.name 'SNK ES Approach anchor'
          git config user.email 'actions@users.noreply.github.com'
          git add es/index.html
          git commit -m 'Fix ES Approach anchor offset'
          git push origin HEAD:main
