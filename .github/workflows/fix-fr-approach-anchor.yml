name: Fix FR Approach anchor offset

on:
  push:
    paths:
      - '.github/workflows/fix-fr-approach-anchor.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply FR Approach anchor
        run: python3 .github/scripts/fix_fr_approach_anchor.py
      - name: Verify and commit
        run: |
          grep -F '#approach{scroll-margin-top:0!important}' fr/index.html
          test "$(git diff --name-only)" = "fr/index.html"
          git diff --check
          git config user.name 'SNK FR Approach anchor'
          git config user.email 'actions@users.noreply.github.com'
          git add fr/index.html
          git commit -m 'Fix FR Approach anchor offset'
          git push origin HEAD:main
