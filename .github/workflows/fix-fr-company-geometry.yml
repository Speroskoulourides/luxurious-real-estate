name: Fix FR Company geometry

on:
  push:
    paths:
      - '.github/workflows/fix-fr-company-geometry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply FR Company geometry
        run: python3 .github/scripts/fix_fr_company_geometry.py
      - name: Verify and commit
        run: |
          grep -F '#company{min-height:calc(100vh - 76px)!important;scroll-margin-top:0!important}' fr/index.html
          test "$(git diff --name-only)" = "fr/index.html"
          git diff --check
          git config user.name 'SNK FR Company geometry'
          git config user.email 'actions@users.noreply.github.com'
          git add fr/index.html
          git commit -m 'Fix FR Company geometry'
          git push origin HEAD:main
