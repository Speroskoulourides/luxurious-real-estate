name: Lock Chinese Golden Visa mode

on:
  push:
    paths:
      - '.github/workflows/fix-golden-visa-zh-lock.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep Golden Visa Chinese mode persistent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('golden-visa/index.html')
          s = p.read_text(encoding='utf-8')

          old_link = '<a href="#" class="zh-button" data-lang="zh">中文</a>'
          new_link = '<a href="/golden-visa/?lang=zh" class="zh-button" data-lang="zh">中文</a>'
          if s.count(old_link) != 1:
              raise SystemExit(f'Expected one Chinese language link, found {s.count(old_link)}')
          s = s.replace(old_link, new_link, 1)

          old = '''<script id="snk-golden-visa-direct-zh">
(()=>{
  const activate=()=>{
    if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
    document.documentElement.lang='zh-CN';
    Object.entries(translations).forEach(([selector,text])=>{const el=document.querySelector(selector);if(el)el.innerHTML=text[1]});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});else activate();
})();
</script>'''

          new = '''<script id="snk-golden-visa-direct-zh">
(()=>{
  if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
  let applying=false;
  const activate=()=>{
    if(applying)return;
    applying=true;
    document.documentElement.lang='zh-CN';
    Object.entries(translations).forEach(([selector,text])=>{
      const el=document.querySelector(selector);
      if(el && el.innerHTML!==text[1])el.innerHTML=text[1];
    });
    const zhButton=document.querySelector('.zh-button');
    if(zhButton)zhButton.classList.add('active');
    applying=false;
  };
  const start=()=>{
    activate();
    const observer=new MutationObserver(()=>activate());
    observer.observe(document.body,{subtree:true,childList:true,characterData:true});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>'''

          if s.count(old) != 1:
              raise SystemExit(f'Expected one current direct Chinese script, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F '<a href="/golden-visa/?lang=zh" class="zh-button" data-lang="zh">中文</a>' golden-visa/index.html
          grep -F 'const observer=new MutationObserver(()=>activate());' golden-visa/index.html
          grep -F "if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;" golden-visa/index.html
          test "$(git diff --name-only)" = "golden-visa/index.html"
          git diff --check
          git config user.name 'SNK Golden Visa zh lock'
          git config user.email 'actions@users.noreply.github.com'
          git add golden-visa/index.html
          git commit -m 'Lock Chinese Golden Visa mode'
          git push origin HEAD:main
