name: Audit SNK global headers and Greek terminology

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit live HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          excluded_tokens = (
              'backup', 'old', 'before-menu-fix', 'index_mykonos_old',
              'vouliagmeni-index-fixed'
          )

          files = []
          for p in sorted(Path('.').rglob('*.html')):
              rel = p.as_posix().lower()
              if any(token in rel for token in excluded_tokens):
                  continue
              files.append(p)

          print('=== HEADER AUDIT ===')
          for p in files:
              s = p.read_text(encoding='utf-8', errors='replace')
              corporate = any(marker in s for marker in (
                  'snk-opportunity-header',
                  'snk-global-header',
                  'class="topbar"',
                  "class='topbar'",
                  'class="topbar ',
                  "class='topbar "
              ))
              any_header = bool(re.search(r'<header\b', s, re.I))
              print(f'{p.as_posix()}\tcorporate={corporate}\tany_header={any_header}\tsize={len(s)}')

          print('\n=== GREEK ΕΥΚΑΙΡ* OCCURRENCES ===')
          pat = re.compile(r'.{0,90}ευκαιρ.{0,130}', re.I | re.S)
          total = 0
          for p in files:
              s = p.read_text(encoding='utf-8', errors='replace')
              matches = list(pat.finditer(s))
              if not matches:
                  continue
              total += len(matches)
              print(f'-- {p.as_posix()} ({len(matches)})')
              for i, m in enumerate(matches, 1):
                  snippet = re.sub(r'\s+', ' ', m.group(0)).strip()
                  print(f'  {i}: {snippet}')
          print(f'TOTAL={total}')
          PY
