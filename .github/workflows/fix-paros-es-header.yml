name: Connect Vouliagmeni EL enquiry button to contact

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update only the Vouliagmeni EL enquiry button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vouliagmeni/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a class="btn" href="mailto:investments@snkrealestate.com?subject=Private%20Enquiry%20-%20Vouliagmeni">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ</a>'
          new = '<a class="btn" href="/el/#contact">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ</a>'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one matching enquiry button, found {count}')

          updated = text.replace(old, new, 1)
          if old in updated:
              raise SystemExit('Old mailto button still remains')
          if updated.count(new) != 1:
              raise SystemExit('Contact-linked button was not installed exactly once')

          path.write_text(updated, encoding='utf-8')
          print('Updated only vouliagmeni/index.html enquiry button')
          PY

      - name: Verify and commit the single-file change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "vouliagmeni/index.html" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git diff --check
          git diff -- vouliagmeni/index.html
          git config user.name 'SNK EL page update'
          git config user.email 'actions@users.noreply.github.com'
          git add vouliagmeni/index.html
          git commit -m 'Connect Vouliagmeni EL enquiry button to contact'
          git push origin HEAD:main
