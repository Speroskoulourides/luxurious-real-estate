name: Remove PT from Paros headers

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove PT safely from Paros EN and FR
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('paros-en/index.html'), Path('paros-fr/index.html')]
          pt_anchor = re.compile(r'<a\b[^>]*>\s*PT\s*</a>', re.S)
          sep_pt = re.compile(r'<span[^>]*>\s*·\s*</span>\s*<a\b[^>]*>\s*PT\s*</a>', re.S)

          for p in files:
              s = p.read_text(encoding='utf-8')
              hits = list(pt_anchor.finditer(s))
              if not hits:
                  print(f'{p}: PT already absent')
                  continue
              if len(hits) != 1:
                  raise SystemExit(f'{p}: expected exactly one PT language link, found {len(hits)}')

              hit = hits[0]
              context = s[max(0, hit.start()-1200):min(len(s), hit.end()+300)]
              for code in ('EN', 'EL', 'FR', 'ES', 'TR'):
                  if f'>{code}</a>' not in context:
                      raise SystemExit(f'{p}: PT link is not inside the expected language block ({code} missing nearby)')

              start = max(0, hit.start()-250)
              segment = s[start:hit.end()]
              matches = list(sep_pt.finditer(segment))
              if len(matches) != 1 or matches[0].end() != len(segment):
                  raise SystemExit(f'{p}: could not identify PT plus its preceding separator safely')

              rm_start = start + matches[0].start()
              rm_end = start + matches[0].end()
              s2 = s[:rm_start] + s[rm_end:]
              if pt_anchor.search(s2):
                  raise SystemExit(f'{p}: PT still present after edit')
              p.write_text(s2, encoding='utf-8')
              print(f'{p}: PT removed')
          PY

      - name: Verify EN FR ES TR remain and PT is gone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in [Path('paros-en/index.html'), Path('paros-fr/index.html')]:
              s = p.read_text(encoding='utf-8')
              if re.search(r'<a\b[^>]*>\s*PT\s*</a>', s, re.S):
                  raise SystemExit(f'{p}: PT still present')
              print(f'{p}: verified PT absent')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- paros-en/index.html paros-fr/index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'SNK header update'
          git config user.email 'actions@users.noreply.github.com'
          git add paros-en/index.html paros-fr/index.html
          git commit -m 'Remove PT from Paros EN and FR headers'
          git push origin HEAD:main
