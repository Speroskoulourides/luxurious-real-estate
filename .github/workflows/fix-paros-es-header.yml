name: Repair Chinese Golden Visa workflow

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix Chinese activation
        run: |
          python3 -c "from pathlib import Path; p=Path('golden-visa/index.html'); s=p.read_text(encoding='utf-8'); old=\"document.querySelectorAll('.zh-button').forEach(button=>button.addEventListener('click',()=>{\"; new=\"document.querySelectorAll('.zh-button').forEach(button=>button.addEventListener('click',(event)=>{event.preventDefault();\"; assert s.count(old)==1, s.count(old); s=s.replace(old,new,1); old2=\"const button=document.querySelector('.zh-button[data-lang=\\\"zh\\\"]');\\n    if(button)button.click();\"; new2=\"document.documentElement.lang='zh-CN';\\n    Object.entries(translations).forEach(([selector,text])=>{const el=document.querySelector(selector);if(el)el.innerHTML=text[1]});\"; assert s.count(old2)==1, s.count(old2); s=s.replace(old2,new2,1); p.write_text(s,encoding='utf-8')"

      - name: Verify
        run: |
          grep -F 'event.preventDefault()' golden-visa/index.html
          grep -F "document.documentElement.lang='zh-CN'" golden-visa/index.html
          if grep -F 'if(button)button.click();' golden-visa/index.html; then exit 1; fi
          git diff --check

      - name: Commit
        run: |
          git config user.name 'SNK Golden Visa update'
          git config user.email 'actions@users.noreply.github.com'
          git add golden-visa/index.html
          git commit -m 'Repair Chinese Golden Visa activation'
          git push origin HEAD:main
