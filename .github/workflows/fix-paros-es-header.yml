name: Restore Chinese Golden Visa query link in EN header

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Change only EN Chinese Golden Visa link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<a href="/golden-visa/">中文 GOLDEN VISA</a>'
          new = '<a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one EN Chinese Golden Visa link, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Restored ?lang=zh in EN header')
          PY

      - name: Verify and commit only EN homepage
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          grep -F '<a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>' index.html
          git diff --check
          git config user.name 'SNK EN menu update'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore Chinese Golden Visa query link in EN header'
          git push origin HEAD:main
