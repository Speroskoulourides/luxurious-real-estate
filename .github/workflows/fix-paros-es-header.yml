name: Fix Signature EL Contact direct link

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix Signature EL Contact link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vouliagmeni/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>'
          new = '<a href="/el-contact/">ΕΠΙΚΟΙΝΩΝΙΑ</a>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old Contact link, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Signature EL Contact now points directly to /el-contact/')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -F '<a href="/el-contact/">ΕΠΙΚΟΙΝΩΝΙΑ</a>' vouliagmeni/index.html
          if grep -F '<a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>' vouliagmeni/index.html; then
            echo 'Old Contact link still present'
            exit 1
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != "vouliagmeni/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          git diff --check
          git config user.name 'SNK Signature EL update'
          git config user.email 'actions@users.noreply.github.com'
          git add vouliagmeni/index.html
          git commit -m 'Fix Signature EL Contact direct link'
          git push origin HEAD:main
