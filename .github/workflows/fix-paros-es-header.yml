name: Add Chinese Golden Visa menu entry

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Chinese Golden Visa link and direct Chinese activation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) EL homepage: add one standalone Chinese Golden Visa item to the universal header.
          el_path = Path('el/index.html')
          el = el_path.read_text(encoding='utf-8')
          old_nav = '<a href="/vouliagmeni/">SIGNATURE</a><a href="/el/#approach">ΠΡΟΣΕΓΓΙΣΗ</a>'
          new_nav = '<a href="/vouliagmeni/">SIGNATURE</a><a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a><a href="/el/#approach">ΠΡΟΣΕΓΓΙΣΗ</a>'
          if el.count(old_nav) != 1:
              raise SystemExit(f'Expected one EL universal nav insertion point, found {el.count(old_nav)}')
          el = el.replace(old_nav, new_nav, 1)
          if el.count('href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>') != 1:
              raise SystemExit('Chinese Golden Visa menu item was not installed exactly once')
          el_path.write_text(el, encoding='utf-8')

          # 2) Golden Visa EN page: allow a direct ?lang=zh URL to activate the existing Chinese translation.
          gv_path = Path('golden-visa/index.html')
          gv = gv_path.read_text(encoding='utf-8')
          marker = '</body></html>'
          if gv.count(marker) != 1:
              raise SystemExit(f'Expected one Golden Visa closing marker, found {gv.count(marker)}')
          auto = '''<script id="snk-golden-visa-direct-zh">
          (()=>{
            const activate=()=>{
              if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
              const button=document.querySelector('.zh-button[data-lang="zh"]');
              if(button)button.click();
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});else activate();
          })();
          </script>
          '''
          if 'id="snk-golden-visa-direct-zh"' in gv:
              raise SystemExit('Direct Chinese activation already exists; stopping to avoid duplication')
          gv = gv.replace(marker, auto + marker, 1)
          gv_path.write_text(gv, encoding='utf-8')

          print('Updated only el/index.html and golden-visa/index.html')
          PY

      - name: Verify and commit only the two required files
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'el/index.html' 'golden-visa/index.html' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi

          grep -F 'href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>' el/index.html
          grep -F 'id="snk-golden-visa-direct-zh"' golden-visa/index.html
          git diff --check
          git config user.name 'SNK site update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html golden-visa/index.html
          git commit -m 'Add Chinese Golden Visa menu entry'
          git push origin HEAD:main
