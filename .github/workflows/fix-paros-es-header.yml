name: Link EL Contact to investor contact page

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update EL Contact link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('el/index.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'<a href="[^"]*">ΕΠΙΚΟΙΝΩΝΙΑ</a>'
          matches = list(re.finditer(pattern, text))
          if not matches:
              raise SystemExit('No EL Contact links found')

          first = matches[0]
          text = text[:first.start()] + '<a href="/el-contact/">ΕΠΙΚΟΙΝΩΝΙΑ</a>' + text[first.end():]
          path.write_text(text, encoding='utf-8')
          print('EL universal header Contact now points to /el-contact/')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -F '<a href="/el-contact/">ΕΠΙΚΟΙΝΩΝΙΑ</a>' el/index.html
          changed="$(git diff --name-only)"
          if [ "$changed" != "el/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          git diff --check
          git config user.name 'SNK EL contact update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Link EL Contact to investor contact page'
          git push origin HEAD:main
