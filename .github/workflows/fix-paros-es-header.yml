name: Audit correct EL investor contact location

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Find the correct EL investor contact screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needles = [
              'Εκδηλώστε το επενδυτικό σας ενδιαφέρον',
              'ΑΠΟΣΤΟΛΗ ΕΠΕΝΔΥΤΙΚΟΥ ΑΙΤΗΜΑΤΟΣ',
              'Περιγράψτε συνοπτικά το επενδυτικό σας ενδιαφέρον',
          ]

          matches = []
          for path in Path('.').rglob('*.html'):
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              found = [needle for needle in needles if needle in text]
              if found:
                  matches.append((str(path), found))

          print('MATCHES:')
          for path, found in matches:
              print(path)
              for needle in found:
                  print('  -', needle)

          if not matches:
              raise SystemExit('No matching EL investor contact screen found')
          PY
