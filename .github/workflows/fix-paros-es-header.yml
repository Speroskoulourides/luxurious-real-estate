name: Point EL contact to Paros Greek contact

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Change only EL Contact destination
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('el/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>'
          new = '<a href="/paros/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one EL Contact link, found {text.count(old)}')

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          print('Updated only EL Contact destination to Paros Greek contact')
          PY

      - name: Verify and commit only EL homepage
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "el/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

          grep -F '<a href="/paros/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>' el/index.html
          git diff --check
          git config user.name 'SNK EL contact update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Point EL Contact to Paros Greek contact'
          git push origin HEAD:main
