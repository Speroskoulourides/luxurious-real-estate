name: Refine Paros card on EL homepage

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update only the Paros card on the EL homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('el/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a class="project project-paros" href="../paros/"><span>03 · PAROS</span><h3>Ξενοδοχειακή Επένδυση</h3><em>ΑΝΑΚΑΛΥΨΤΕ ΤΗΝ ΕΠΕΝΔΥΣΗ ΣΤΗΝ ΠΑΡΟ ↗</em></a>'
          new = '<a class="project project-paros" href="../paros/"><span>03 · PAROS</span><h3>Ξενοδοχειακό Επενδυτικό Έργο</h3><em>ΔΕΙΤΕ ΤΟΝ ΕΠΕΝΔΥΤΙΚΟ ΦΑΚΕΛΟ ↗</em></a>'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one matching Paros card, found {count}')

          updated = text.replace(old, new, 1)
          if old in updated:
              raise SystemExit('Old Paros wording still remains')
          if updated.count(new) != 1:
              raise SystemExit('New Paros wording was not installed exactly once')

          path.write_text(updated, encoding='utf-8')
          print('Updated only el/index.html Paros card')
          PY

      - name: Verify and commit the single-file change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "el/index.html" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

          git diff --check
          git diff -- el/index.html
          git config user.name 'SNK EL page update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Refine Paros investment project card on EL homepage'
          git push origin HEAD:main
