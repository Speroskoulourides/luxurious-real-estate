name: Fix direct Chinese Golden Visa activation

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make lang=zh apply Chinese directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('golden-visa/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''<script id="snk-golden-visa-direct-zh">
(()=>{
  const activate=()=>{
    if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
    const button=document.querySelector('.zh-button[data-lang="zh"]');
    if(button)button.click();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});else activate();
})();
</script>'''

          new = '''<script id="snk-golden-visa-direct-zh">
(()=>{
  const activate=()=>{
    if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
    document.documentElement.lang='zh-CN';
    if(typeof translations!=='object')return;
    Object.entries(translations).forEach(([selector,text])=>{
      const el=document.querySelector(selector);
      if(el)el.innerHTML=text[1];
    });
    document.querySelectorAll('.zh-button').forEach(b=>b.classList.add('active'));
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});else activate();
})();
</script>'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old direct Chinese script, found {text.count(old)}')

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          print('Updated only the direct Chinese activation script')
          PY

      - name: Verify and commit only Golden Visa
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "golden-visa/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

          grep -F "document.documentElement.lang='zh-CN'" golden-visa/index.html
          grep -F "if(el)el.innerHTML=text[1]" golden-visa/index.html
          git diff --check
          git config user.name 'SNK Golden Visa update'
          git config user.email 'actions@users.noreply.github.com'
          git add golden-visa/index.html
          git commit -m 'Fix direct Chinese Golden Visa activation'
          git push origin HEAD:main
