name: Remove Golden Visa from EL header

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove only Golden Visa from EL universal header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('el/index.html')
          text = path.read_text(encoding='utf-8')

          pattern = r'<a href="/golden-visa/(?:\?lang=zh)?">中文 GOLDEN VISA</a>'
          matches = re.findall(pattern, text)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one EL Golden Visa menu item, found {len(matches)}')

          updated = re.sub(pattern, '', text, count=1)
          path.write_text(updated, encoding='utf-8')
          print('Removed Chinese Golden Visa from EL header only')
          PY

      - name: Verify and commit only EL homepage
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "el/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          if grep -F '中文 GOLDEN VISA' el/index.html; then
            echo 'Golden Visa still exists in EL homepage'
            exit 1
          fi
          git diff --check
          git config user.name 'SNK EL menu update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Remove Golden Visa from EL header'
          git push origin HEAD:main
