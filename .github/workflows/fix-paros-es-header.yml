name: Point Vouliagmeni EL top menu contact to Greek form

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update only the Vouliagmeni EL top menu contact link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vouliagmeni/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>'
          new = '<a href="/athens-investment/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one universal EL contact menu link, found {text.count(old)}')

          text = text.replace(old, new, 1)
          if text.count(new) != 1:
              raise SystemExit('Correct Greek contact form link was not installed exactly once')

          path.write_text(text, encoding='utf-8')
          print('Updated only Vouliagmeni EL top menu contact link')
          PY

      - name: Verify and commit the single-file change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "vouliagmeni/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

          grep -F 'href="/athens-investment/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>' vouliagmeni/index.html
          git diff --check
          git config user.name 'SNK EL page update'
          git config user.email 'actions@users.noreply.github.com'
          git add vouliagmeni/index.html
          git commit -m 'Point Vouliagmeni EL top menu contact to Greek form'
          git push origin HEAD:main
