name: Fix persistent Chinese Golden Visa mode

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix Chinese mode without simulated click
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('golden-visa/index.html')
          text = path.read_text(encoding='utf-8')

          old_handler = "document.querySelectorAll('.zh-button').forEach(button=>button.addEventListener('click',()=>{const zh=button.dataset.lang==='zh';document.documentElement.lang=zh?'zh-CN':'en';Object.entries(translations).forEach(([selector,text])=>{const el=document.querySelector(selector);if(el)el.innerHTML=text[zh?1:0]});document.querySelectorAll('.language.button').forEach(b=>b.classList.toggle('active',b===button));}));"
          new_handler = "document.querySelectorAll('.zh-button').forEach(button=>button.addEventListener('click',(event)=>{event.preventDefault();const zh=button.dataset.lang==='zh';document.documentElement.lang=zh?'zh-CN':'en';Object.entries(translations).forEach(([selector,text])=>{const el=document.querySelector(selector);if(el)el.innerHTML=text[zh?1:0]});document.querySelectorAll('.zh-button').forEach(b=>b.classList.toggle('active',b===button));}));"

          old_direct = '''<script id="snk-golden-visa-direct-zh">
(()=>{
  const activate=()=>{
    if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
    const button=document.querySelector('.zh-button[data-lang="zh"]');
    if(button)button.click();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});else activate();
})();
</script>'''

          new_direct = '''<script id="snk-golden-visa-direct-zh">
(()=>{
  const activate=()=>{
    if(new URLSearchParams(window.location.search).get('lang')!=='zh')return;
    document.documentElement.lang='zh-CN';
    if(typeof translations!=='object')return;
    Object.entries(translations).forEach(([selector,text])=>{
      const el=document.querySelector(selector);
      if(el)el.innerHTML=text[1];
    });
    document.querySelectorAll('.zh-button').forEach(b=>b.classList.add('active'));
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',activate,{once:true});else activate();
})();
</script>'''

          if text.count(old_handler) != 1:
              raise SystemExit(f'Expected one old Chinese click handler, found {text.count(old_handler)}')
          if text.count(old_direct) != 1:
              raise SystemExit(f'Expected one old direct Chinese script, found {text.count(old_direct)}')

          updated = text.replace(old_handler, new_handler, 1).replace(old_direct, new_direct, 1)
          path.write_text(updated, encoding='utf-8')
          print('Fixed persistent Chinese mode in golden-visa/index.html')
          PY

      - name: Verify and commit only Golden Visa
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "golden-visa/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

          grep -F 'event.preventDefault()' golden-visa/index.html
          grep -F "document.documentElement.lang='zh-CN'" golden-visa/index.html
          grep -F 'if(el)el.innerHTML=text[1]' golden-visa/index.html
          git diff --check
          git config user.name 'SNK Golden Visa update'
          git config user.email 'actions@users.noreply.github.com'
          git add golden-visa/index.html
          git commit -m 'Fix persistent Chinese Golden Visa mode'
          git push origin HEAD:main
