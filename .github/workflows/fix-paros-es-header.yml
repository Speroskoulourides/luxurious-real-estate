name: Add Chinese Golden Visa to EN header

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Chinese Golden Visa only to EN universal header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          target = '<a href="/#contact">CONTACT</a></nav>'
          replacement = '<a href="/#contact">CONTACT</a><a href="/golden-visa/">中文 GOLDEN VISA</a></nav>'

          if replacement in text:
              raise SystemExit('EN header already has Chinese Golden Visa')
          if text.count(target) != 1:
              raise SystemExit(f'Expected one EN header insertion point, found {text.count(target)}')

          path.write_text(text.replace(target, replacement, 1), encoding='utf-8')
          print('Added Chinese Golden Visa to EN universal header')
          PY

      - name: Verify and commit only EN homepage
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          grep -F '<a href="/#contact">CONTACT</a><a href="/golden-visa/">中文 GOLDEN VISA</a></nav>' index.html
          git diff --check
          git config user.name 'SNK EN menu update'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Chinese Golden Visa to EN header'
          git push origin HEAD:main
