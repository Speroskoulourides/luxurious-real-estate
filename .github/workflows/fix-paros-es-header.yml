name: Point Chinese Golden Visa menu to EN page

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point Chinese Golden Visa menu items to EN page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('el/index.html'), Path('fr/index.html'), Path('es/index.html')]
          old = 'href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>'
          new = 'href="/golden-visa/">中文 GOLDEN VISA</a>'

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No Chinese Golden Visa menu links found to update')
          print('\n'.join(changed))
          PY

      - name: Verify
        shell: bash
        run: |
          if grep -R -F 'href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>' index.html el/index.html fr/index.html es/index.html; then
            echo 'Old direct Chinese menu link still present'
            exit 1
          fi
          grep -R -F 'href="/golden-visa/">中文 GOLDEN VISA</a>' index.html el/index.html fr/index.html es/index.html
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name 'SNK menu update'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html el/index.html fr/index.html es/index.html
          git commit -m 'Point Chinese Golden Visa menu to EN page'
          git push origin HEAD:main
