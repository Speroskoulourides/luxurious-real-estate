name: Move Chinese Golden Visa to end of EL menu

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move only the Chinese Golden Visa item in EL nav
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('el/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a href="/vouliagmeni/">SIGNATURE</a><a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a><a href="/el/#approach">ΠΡΟΣΕΓΓΙΣΗ</a><a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a>'
          new = '<a href="/vouliagmeni/">SIGNATURE</a><a href="/el/#approach">ΠΡΟΣΕΓΓΙΣΗ</a><a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a><a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one EL nav sequence, found {text.count(old)}')

          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          print('Moved Chinese Golden Visa to the end of the EL universal menu')
          PY

      - name: Verify and commit only EL homepage
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "el/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

          grep -F '<a href="/el/#contact">ΕΠΙΚΟΙΝΩΝΙΑ</a><a href="/golden-visa/?lang=zh">中文 GOLDEN VISA</a>' el/index.html
          git diff --check
          git config user.name 'SNK EL menu update'
          git config user.email 'actions@users.noreply.github.com'
          git add el/index.html
          git commit -m 'Move Chinese Golden Visa to end of EL menu'
          git push origin HEAD:main
