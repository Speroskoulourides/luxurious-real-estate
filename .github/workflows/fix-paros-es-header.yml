name: Point Vouliagmeni EL enquiry to correct EL contact form

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update only the Vouliagmeni EL enquiry button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vouliagmeni/index.html')
          text = path.read_text(encoding='utf-8')

          targets = [
              '/#contact',
              '/el/#contact',
              '/paros/#private-request',
              'mailto:investments@snkrealestate.com?subject=Private%20Enquiry%20-%20Vouliagmeni',
          ]

          found = []
          for target in targets:
              old = f'<a class="btn" href="{target}">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ</a>'
              if old in text:
                  found.append(old)

          if len(found) != 1:
              raise SystemExit(f'Expected exactly one known Vouliagmeni enquiry button, found {len(found)}')

          new = '<a class="btn" href="/athens-investment/#contact">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ</a>'
          text = text.replace(found[0], new, 1)

          if text.count(new) != 1:
              raise SystemExit('Correct EL contact link was not installed exactly once')

          path.write_text(text, encoding='utf-8')
          print('Updated only vouliagmeni/index.html')
          PY

      - name: Verify and commit the single-file change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "vouliagmeni/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi

          grep -F 'href="/athens-investment/#contact">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ' vouliagmeni/index.html
          git diff --check
          git config user.name 'SNK EL page update'
          git config user.email 'actions@users.noreply.github.com'
          git add vouliagmeni/index.html
          git commit -m 'Point Vouliagmeni EL enquiry to correct EL contact form'
          git push origin HEAD:main
