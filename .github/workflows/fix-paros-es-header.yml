name: Point Vouliagmeni EL button to main contact

on:
  push:
    paths:
      - '.github/workflows/fix-paros-es-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Change only the Vouliagmeni EL button destination
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vouliagmeni/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a class="btn" href="/el/#contact">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ</a>'
          new = '<a class="btn" href="/#contact">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ</a>'

          if text.count(old) != 1:
              raise SystemExit('Expected exactly one EL contact button')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify and commit the single-file change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "vouliagmeni/index.html" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          grep -F 'href="/#contact">ΑΙΤΗΜΑ ΙΔΙΩΤΙΚΗΣ ΕΝΗΜΕΡΩΣΗΣ' vouliagmeni/index.html
          git diff --check
          git config user.name 'SNK EL page update'
          git config user.email 'actions@users.noreply.github.com'
          git add vouliagmeni/index.html
          git commit -m 'Point Vouliagmeni EL enquiry button to main contact'
          git push origin HEAD:main
