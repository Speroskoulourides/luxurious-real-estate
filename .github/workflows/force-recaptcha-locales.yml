name: Force reCAPTCHA locales

on:
  push:
    paths:
      - '.github/recaptcha-locale-trigger.txt'

permissions:
  contents: write

jobs:
  update-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set reCAPTCHA language per site locale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          mapping = {
              Path('index.html'): 'en',
              Path('fr/index.html'): 'fr',
              Path('es/index.html'): 'es',
          }
          base = 'https://www.google.com/recaptcha/api.js'
          for path, lang in mapping.items():
              text = path.read_text(encoding='utf-8')
              text = text.replace(f'{base}?hl=en', f'{base}?hl={lang}')
              text = text.replace(f'{base}?hl=fr', f'{base}?hl={lang}')
              text = text.replace(f'{base}?hl=es', f'{base}?hl={lang}')
              text = text.replace(f'{base}" async defer', f'{base}?hl={lang}" async defer')
              path.write_text(text, encoding='utf-8')
              print('Updated', path, lang)
          PY
      - name: Commit locale update
        shell: bash
        run: |
          git config user.name "SNK Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html fr/index.html es/index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Set reCAPTCHA language per corporate locale"
            git push
          fi
