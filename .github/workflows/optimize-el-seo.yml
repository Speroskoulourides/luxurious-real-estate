name: Optimize EL SEO

on:
  push:
    paths:
      - '.github/workflows/optimize-el-seo.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply EL SEO optimization
        run: python .github/scripts/optimize_el_seo.py
      - name: Verify scope
        run: |
          test "$(git diff --name-only)" = "el/index.html"
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "SNK EL SEO"
          git config user.email "actions@users.noreply.github.com"
          git add el/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize EL SEO"
          git push origin main
