name: Optimize EN SEO keywords

on:
  push:
    paths:
      - '.github/workflows/optimize-en-seo-keywords.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply EN SEO optimization
        run: python .github/scripts/optimize_en_seo_keywords.py
      - name: Verify only index changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit and push
        run: |
          git config user.name "SNK EN SEO"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize EN SEO keywords"
          git push origin main
