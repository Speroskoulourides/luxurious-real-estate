name: Optimize ES SEO

on:
  push:
    paths:
      - '.github/workflows/optimize-es-seo.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply ES SEO changes
        run: python .github/scripts/optimize_es_seo.py
      - name: Verify scope
        shell: bash
        run: |
          set -e
          changed="$(git diff --name-only)"
          test "$changed" = "es/index.html"
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "SNK ES SEO"
          git config user.email "actions@users.noreply.github.com"
          git add es/index.html
          git commit -m "Optimize ES SEO"
          git push origin main

