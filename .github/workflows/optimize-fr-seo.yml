name: Optimize FR SEO

on:
  push:
    paths:
      - '.github/workflows/optimize-fr-seo.yml'

permissions:
  contents: write

jobs:
  optimize-fr-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Optimize FR SEO
        run: python .github/scripts/optimize_fr_seo.py
      - name: Verify scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "fr/index.html"
      - name: Commit and push
        run: |
          git config user.name "SNK FR SEO"
          git config user.email "actions@users.noreply.github.com"
          git add fr/index.html
          git commit -m "Optimize FR SEO"
          git push origin main
