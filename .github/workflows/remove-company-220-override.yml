name: Remove Company 220px override

on:
  push:
    paths:
      - '.github/workflows/remove-company-220-override.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove only the final 220px Company override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('corporate-styles.css')
          s = p.read_text(encoding='utf-8')
          old = '/* COMPANY — FINAL LAYOUT */\n#company {\n    display: block;\n    padding-top: 220px;\n}'
          new = '/* COMPANY — FINAL LAYOUT */\n#company {\n    display: block;\n}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one final 220px override, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F 'padding-top: 70px;' corporate-styles.css
          ! grep -F 'padding-top: 220px;' corporate-styles.css
          test "$(git diff --name-only)" = "corporate-styles.css"
          git diff --check
          git config user.name 'SNK corporate spacing fix'
          git config user.email 'actions@users.noreply.github.com'
          git add corporate-styles.css
          git commit -m 'Remove conflicting Company spacing override'
          git push origin HEAD:main
