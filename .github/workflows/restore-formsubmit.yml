name: Apply EN form fallback

on:
  push:
    paths:
      - '.github/workflows/restore-formsubmit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch EN contact form directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'id="snk-en-mail-fallback"'
          if marker in text:
              raise SystemExit('EN fallback already present')

          script = r'''
<script id="snk-en-mail-fallback">
(()=>{
  const form=document.getElementById('snkInvestorForm');
  if(!form)return;
  form.removeAttribute('action');
  form.removeAttribute('target');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(!form.reportValidity())return;
    const fd=new FormData(form);
    const get=n=>String(fd.get(n)||'').trim();
    const subject='SNK Website Enquiry - '+(get('fullName')||'Investor');
    const body=[
      'New SNK Website Enquiry','',
      'Full Name: '+get('fullName'),
      'Email: '+get('email'),
      'Company / Organisation: '+get('company'),
      'Position / Title: '+get('position'),
      'Country: '+get('country'),
      'Mobile / Telephone: '+get('mobile'),
      'Investor Type: '+get('investorType'),
      'Investment Range: '+get('investmentRange'),
      'Area of Interest: '+get('interest'),
      'Message: '+get('message')
    ].join('\n');
    window.location.href='mailto:investments@snkrealestate.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  });
})();
</script>
'''
          if '</body>' not in text:
              raise SystemExit('No closing body tag found')
          text = text.replace('</body>', script + '</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Patched index.html with EN mail fallback')
          PY

      - name: Commit EN fallback
        shell: bash
        run: |
          git config user.name "SNK Form Restore"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Apply EN email fallback directly"
          git push origin main
