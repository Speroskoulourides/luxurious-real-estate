name: Test EN corporate geometry

on:
  push:
    paths:
      - '.github/workflows/test-en-signature-geometry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply EN-only geometry override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SNK UNIVERSAL HEADER STYLES END -->'
          block = '<style id="en-corporate-geometry-test">\nbody.snk-universal-header-enabled{padding-top:76px!important}\n.hero{height:100vh!important}\n@media(max-width:560px){body.snk-universal-header-enabled{padding-top:68px!important}.hero{height:100vh!important}}\n</style>\n'
          if 'id="en-corporate-geometry-test"' in s:
              raise SystemExit('EN geometry test already present')
          if marker not in s:
              raise SystemExit('Header style end marker not found')
          s = s.replace(marker, marker + '\n' + block, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F 'id="en-corporate-geometry-test"' index.html
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          git config user.name 'SNK EN geometry test'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Test EN corporate geometry against Signature'
          git push origin HEAD:main
