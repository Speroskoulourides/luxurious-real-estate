name: Raise EN Company section

on:
  push:
    paths:
      - '.github/workflows/test-en-signature-geometry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove EN Company full viewport minimum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<style id="en-corporate-geometry-test">\nbody.snk-universal-header-enabled{padding-top:0!important}\n.hero{height:100vh!important}\n@media(max-width:560px){body.snk-universal-header-enabled{padding-top:0!important}.hero{height:100vh!important}}\n</style>'
          new = '<style id="en-corporate-geometry-test">\nbody.snk-universal-header-enabled{padding-top:0!important}\n.hero{height:100vh!important}\n#company{min-height:auto!important}\n@media(max-width:560px){body.snk-universal-header-enabled{padding-top:0!important}.hero{height:100vh!important}}\n</style>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one EN geometry block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F '#company{min-height:auto!important}' index.html
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          git config user.name 'SNK EN Company spacing'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Raise EN Company section'
          git push origin HEAD:main
