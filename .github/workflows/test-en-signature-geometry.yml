name: Set EN Company height

on:
  push:
    paths:
      - '.github/workflows/test-en-signature-geometry.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set EN Company to 80vh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '#company{min-height:auto!important}'
          new = '#company{min-height:80vh!important}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one EN Company auto height rule, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -F '#company{min-height:80vh!important}' index.html
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          git config user.name 'SNK EN Company spacing'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Set EN Company height to 80vh'
          git push origin HEAD:main
