<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SNK | The Ellinikon Buyer Journey</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a1420}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="deck" src="presentation.html" title="The Ellinikon Buyer Journey"></iframe>
<script>
const frame=document.getElementById('deck');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  if(!d)return;
  const style=d.createElement('style');
  style.textContent=`
  .snk-clean-17{display:none;position:absolute;inset:0;margin:auto;width:min(92vw,1600px);aspect-ratio:16/9;background:#f5f2ec;color:#0d2538;z-index:4;box-sizing:border-box;padding:6.5% 7%;font-family:Arial,Helvetica,sans-serif;flex-direction:column;justify-content:center;align-items:flex-start;box-shadow:0 12px 42px rgba(0,0,0,.18)}
  .snk-clean-17 .brand{font-size:13px;letter-spacing:.22em;color:#d29c49;font-weight:700;margin-bottom:34px}.snk-clean-17 .eyebrow{font-size:14px;letter-spacing:.16em;color:#d29c49;font-weight:700;margin-bottom:24px}.snk-clean-17 h2{font-size:clamp(38px,4vw,66px);font-weight:400;margin:0 0 30px;line-height:1.05}.snk-clean-17 p{font-size:clamp(18px,1.6vw,28px);line-height:1.45;max-width:900px;margin:0 0 44px;color:#182b3a}.snk-clean-17 a{display:inline-block;background:#d5a04c;color:#fff;text-decoration:none;padding:18px 28px;font-size:14px;font-weight:700;letter-spacing:.06em;border-radius:4px}.snk-clean-17 .foot{margin-top:28px;font-size:13px;color:#6f7a84}
  `;
  d.head.appendChild(style);
  const viewer=d.querySelector('.viewer');
  if(!viewer)return;
  const clean=d.createElement('div');clean.className='snk-clean-17';clean.innerHTML=`<div class="brand">SNK LUXURY REAL ESTATE</div><div class="eyebrow">THE NEXT STEP</div><h2>Express your interest</h2><p>A personal consultation to identify the residences that best match the way you want to live.</p><a href="https://snkrealestate.com/ellinikon-contact/" target="_blank" rel="noopener">OPEN THE SECURE ONLINE FORM</a><div class="foot">Your Private Selection Begins Here · All enquiries are handled personally and in strict confidence.</div>`;viewer.appendChild(clean);
  const cta=d.getElementById('cta');
  const sync=()=>{const active=d.querySelector('.slide.active');const on17=active&&active.dataset.n==='17';clean.style.display=on17?'flex':'none';if(active)active.style.opacity=on17?'0':'';if(cta)cta.style.display=on17?'none':'';};
  new MutationObserver(sync).observe(viewer,{subtree:true,attributes:true,attributeFilter:['class']});sync();
});
</script>
</body>
</html>
